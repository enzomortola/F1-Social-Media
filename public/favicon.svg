<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <pattern id="checkers" x="0" y="0" width="25" height="25" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="12.5" height="12.5" fill="#121212" />
      <rect x="12.5" y="0" width="12.5" height="12.5" fill="#F0F0F0" />
      <rect x="0" y="12.5" width="12.5" height="12.5" fill="#F0F0F0" />
      <rect x="12.5" y="12.5" width="12.5" height="12.5" fill="#121212" />
    </pattern>
    <clipPath id="circulo">
      <circle cx="50" cy="50" r="50" />
    </clipPath>
  </defs>
  <!-- Sombra negra suave detrás por si hay modos claros -->
  <circle cx="50" cy="50" r="50" fill="#222" />
  <rect width="100" height="100" fill="url(#checkers)" clip-path="url(#circulo)" />
  <!-- Borde rojo estilo PitWall -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="#e8002d" stroke-width="8" clip-path="url(#circulo)" />
</svg>